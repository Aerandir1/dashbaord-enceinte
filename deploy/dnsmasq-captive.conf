# Portail captif de l'enceinte.
# Installe vers /etc/NetworkManager/dnsmasq-shared.d/enceinte-captive.conf
#
# En mode partage (point d'acces de configuration), toutes les requetes DNS
# resolvent vers l'enceinte elle-meme (10.42.0.1, passerelle par defaut de
# NetworkManager en mode partage). Les sondes de connectivite des OS tombent
# alors sur l'enceinte, qui les redirige vers /setup : la page de configuration
# s'ouvre toute seule.
#
# N'a d'effet QUE lorsqu'une connexion partagee est active : en fonctionnement
# Wi-Fi normal, ce fichier est inerte.
#
# NB : le portail automatique suppose que le port 80 pointe vers le dashboard
# (ENABLE_NGINX=true). Sans nginx, l'onboarding reste accessible manuellement
# sur http://10.42.0.1:5001/setup.
address=/#/10.42.0.1
