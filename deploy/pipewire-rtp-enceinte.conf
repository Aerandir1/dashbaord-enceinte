# Emetteur RTP pour l'ordinateur (PipeWire) : ajoute une sortie audio
# « Enceinte Chambre (RTP) » qui envoie le son, sans perte, au recepteur RTP de
# l'enceinte (source « Ordinateur » du dashboard).
#
# A copier SUR L'ORDINATEUR (pas sur l'enceinte) :
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp deploy/pipewire-rtp-enceinte.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire
# puis choisir « Enceinte Chambre (RTP) » comme sortie audio.
#
# destination.ip : l'adresse de l'enceinte (une adresse fixe, reservee dans la
# box, evite de devoir la changer ici). destination.port = RTP_PORT de
# /etc/default/enceinte. Le format doit rester celui attendu par le recepteur :
# L24 (S24BE) / 44100 Hz / 2 canaux. Un fichier multicanal est mixe en stereo
# par PipeWire avant l'envoi : l'enceinte n'a que deux canaux.

context.modules = [
{   name = libpipewire-module-rtp-sink
    args = {
        destination.ip = "192.168.1.56"
        destination.port = 46000
        # Paquets de ~5 ms : bon compromis entre latence et charge en Wi-Fi.
        sess.min-ptime = 2
        sess.max-ptime = 10
        sess.name = "Enceinte Chambre"
        audio.format = "S24BE"
        audio.rate = 44100
        audio.channels = 2
        audio.position = [ FL FR ]
        stream.props = {
            node.name = "rtp-sink-enceinte"
            node.description = "Enceinte Chambre (RTP)"
        }
    }
}
]
