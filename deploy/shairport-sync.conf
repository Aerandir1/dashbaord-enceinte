// Configuration shairport-sync 5.x (AirPlay 2) pour l'enceinte.
// Installee par deploy/install.sh vers /etc/shairport-sync.conf
// Les valeurs @...@ sont remplacees a l'installation.

general = {
  name = "@AIRPLAY_NAME@";
  output_backend = "alsa";

  // Tampon applicatif : encaisse la gigue reseau, au prix de la latence.
  audio_backend_buffer_desired_length_in_seconds = 0.35;

  // "auto" (defaut de la 5.x) choisit selon le processeur ; "basic", utilise
  // jusqu'ici, n'est plus recommande.
  interpolation = "auto";

  drift_tolerance_in_seconds = 0.010;
};

alsa = {
  // "default" pointe sur le dmix defini dans /etc/asound.conf, cale sur
  // 44100 Hz : la carte reste partageable avec librespot (un acces direct
  // hw:N est exclusif et rendrait l'autre service muet).
  //
  // Le dimensionnement du tampon materiel (period_size / buffer_size), qui
  // corrige les underruns, est defini une seule fois dans /etc/asound.conf.
  output_device = "@ALSA_DEVICE@";

  // L'AirPlay 2 arrive souvent en 48000 Hz (et en 24 bits pour le lossless).
  // On fige la sortie sur le format du dmix (44100 Hz, 32 bits) pour que
  // shairport-sync fasse lui-meme la conversion de frequence (FFmpeg, propre)
  // au lieu du reechantillonneur lineaire du plugin ALSA "plug". Le 32 bits
  // conserve les 24 bits d'un flux lossless.
  output_rate = 44100;
  output_format = "S32_LE";
  output_channels = 2;
};

diagnostics = {
  // 1 : journalise le format de chaque flux recu (ALAC lossless ou AAC),
  // pour savoir ce qu'envoie chaque appli. Repasser a 0 une fois verifie.
  log_verbosity = 1;
};

metadata = {
  // Titre / artiste / album / pochette sont lus par le dashboard via MPRIS
  // (bus D-Bus systeme). On garde le tube comme repli et pour generer la
  // pochette ; include_cover_art = "yes" alimente mpris:artUrl.
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
