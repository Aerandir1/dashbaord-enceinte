// Configuration shairport-sync (AirPlay) pour l'enceinte.
// Installee par deploy/install.sh vers /etc/shairport-sync.conf
// Les valeurs @...@ sont remplacees a l'installation.

general = {
  name = "@AIRPLAY_NAME@";
  output_backend = "alsa";

  // Tampon applicatif : encaisse la gigue reseau, au prix de la latence.
  audio_backend_buffer_desired_length = 0.35;

  // "basic" coute peu de CPU ; "soxr" est plus propre mais lourd sur un Pi 3.
  interpolation = "basic";

  drift_tolerance_in_seconds = 0.010;
};

alsa = {
  // Attaquer le DAC en direct (hw:N) : via "default"/dmix, shairport-sync ne
  // maitrise plus la cadence de sortie et resynchronise sans arret.
  output_device = "@ALSA_DEVICE@";

  // Tampon materiel explicite. Les defauts d'une carte en acces direct sont
  // trop justes : shairport-sync ecrit par blocs de 352 echantillons (8 ms) et
  // la carte tombait en underrun ~50 fois par minute (mesure), chaque underrun
  // produisant un clic audible.
  period_size = 1024;
  buffer_size = 16384;
};

diagnostics = {
  // Passer a 1 ou 2 pour journaliser resynchronisations et underruns.
  log_verbosity = 0;
};

metadata = {
  // Le dashboard lit ce tube pour afficher titre / artiste / album.
  enabled = "yes";
  include_cover_art = "no";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
