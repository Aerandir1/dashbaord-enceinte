// Configuration shairport-sync (AirPlay) pour l'enceinte.
// Installee par deploy/install.sh vers /etc/shairport-sync.conf
// Les valeurs @...@ sont remplacees a l'installation.

general = {
  name = "@AIRPLAY_NAME@";
  output_backend = "alsa";

  // Tampon applicatif : encaisse la gigue reseau, au prix de la latence.
  // Nom de l'option en shairport-sync 4.x ; la 3.x utilisait
  // "audio_backend_buffer_desired_length", desormais depreciee.
  audio_backend_buffer_desired_length_in_seconds = 0.35;

  // "basic" coute peu de CPU ; "soxr" est plus propre mais lourd sur un Pi 3.
  interpolation = "basic";

  drift_tolerance_in_seconds = 0.010;
};

alsa = {
  // "default" pointe sur le dmix defini dans /etc/asound.conf, cale sur
  // 44100 Hz : la carte reste partageable avec librespot (un acces direct
  // hw:N est exclusif et rendrait l'autre service muet) sans pour autant
  // reechantillonner.
  //
  // Le dimensionnement du tampon materiel (period_size / buffer_size), qui
  // corrige les underruns, est defini une seule fois dans /etc/asound.conf.
  output_device = "@ALSA_DEVICE@";
};

diagnostics = {
  // Passer a 1 ou 2 pour journaliser resynchronisations et underruns.
  log_verbosity = 0;
};

metadata = {
  // Titre / artiste / album / pochette sont lus par le dashboard via MPRIS
  // (bus D-Bus systeme). On garde le tube comme repli et pour generer la
  // pochette ; include_cover_art = "yes" alimente mpris:artUrl.
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
