# Reverse proxy de l'enceinte. Installé vers /etc/nginx/sites-available/enceinte
#
# Rôle :
#   1. servir un écran de chargement INSTANTANÉ tant que waitress n'est pas
#      encore prêt (fenêtre de démarrage après un boot) ;
#   2. proxifier tout le reste vers le dashboard (waitress, port 5001).
#
# waitress continue d'écouter sur :5001 : l'accès direct http://<ip>:5001 reste
# possible. nginx ajoute simplement l'accès http://<ip>/ (port 80) avec l'écran
# de chargement au démarrage.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/enceinte;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Flux SSE (/api/stream) : pas de mise en tampon, connexion longue,
        # pas de header Connection imposé côté amont.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";

        # Backend injoignable / pas encore démarré -> écran de chargement.
        # Le =200 renvoie la page en 200 pour qu'elle s'affiche normalement ;
        # elle se recharge toute seule jusqu'à ce que le dashboard réponde.
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /splash.html;
    }

    # Écran de chargement statique, servi uniquement en interne (via error_page).
    location = /splash.html {
        internal;
        root /var/www/enceinte;
    }
}
