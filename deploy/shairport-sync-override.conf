# Drop-in systemd pour shairport-sync.
# Installe vers /etc/systemd/system/shairport-sync.service.d/override.conf
#
# Garantit l'ordonnancement temps reel du thread audio. Sans cela le service
# tourne en SCHED_OTHER priorite 0 et le moindre pic CPU produit un craquement.
# Priorite 45 : au-dessus des taches ordinaires, en dessous des threads noyau
# critiques.

[Service]
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=45
LimitRTPRIO=99
LimitMEMLOCK=infinity
