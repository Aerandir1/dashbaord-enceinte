# Boucle ALSA utilisee comme entree de CamillaDSP.
# Installee vers /etc/modprobe.d/enceinte-aloop.conf
#
# index=10 : la boucle prend un index eleve pour ne PAS decaler celui du DAC
# (le HiFiBerry doit rester carte 0, sinon toute la configuration ALSA et le
# controle du volume pointeraient au mauvais endroit).
#
# pcm_substreams=2 : deux flux simultanes possibles vers la boucle. dmix les
# fusionne de toute facon sur le premier, mais cela evite un echec brutal si
# deux clients l'ouvrent pendant une bascule de source.

options snd_aloop index=10 pcm_substreams=2 id=Loopback
