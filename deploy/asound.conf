# Configuration ALSA de l'enceinte. Installee vers /etc/asound.conf
#
# Probleme resolu : en pointant directement sur le materiel (hw:0), l'acces est
# EXCLUSIF. librespot et shairport-sync tournant en permanence, le premier qui
# ouvrait la carte rendait l'autre muet ("Device or resource busy").
#
# dmix permet le partage. Il est cale ici exactement sur le format des deux
# sources -- AirPlay et Spotify emettent tous deux du 44100 Hz / 16 bits /
# stereo -- il n'y a donc AUCUN reechantillonnage, contrairement au "default"
# generique qui aurait converti en 48000 Hz.

# Les sources n'ecrivent PLUS sur le DAC : elles ecrivent dans la boucle ALSA,
# ou CamillaDSP les lit, applique l'egaliseur, puis alimente le DAC.
# Le DAC n'a donc qu'un seul client : CamillaDSP.
pcm.enceinte {
    type dmix
    ipc_key 1024
    # 0666 est indispensable : les deux services tournent sous des utilisateurs
    # differents (shairport-sync et l'utilisateur du dashboard) et doivent
    # partager le meme segment IPC.
    ipc_perm 0666
    slave {
        # Cote ECRITURE de la boucle. Reference par nom : l'index de la carte
        # peut changer, pas son nom.
        pcm "hw:Loopback,0,0"
        rate 44100
        format S16_LE
        channels 2
        # Meme dimensionnement que celui valide contre les underruns.
        period_size 1024
        buffer_size 16384
    }
    bindings {
        0 0
        1 1
    }
}

# "plug" absorbe un eventuel ecart de format d'une source (mono, 48 kHz...)
# sans rien convertir quand le format correspond deja.
pcm.!default {
    type plug
    slave.pcm "enceinte"
}

# Les controles de volume (amixer) visent la carte materielle.
ctl.!default {
    type hw
    card @CARD_INDEX@
}
