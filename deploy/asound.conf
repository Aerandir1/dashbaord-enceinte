# Configuration ALSA de l'enceinte. Installee vers /etc/asound.conf
#
# Probleme resolu : en pointant directement sur le materiel (hw:0), l'acces est
# EXCLUSIF. librespot et shairport-sync tournant en permanence, le premier qui
# ouvrait la carte rendait l'autre muet ("Device or resource busy").
#
# dmix permet le partage. Il est cale sur 44100 Hz, la frequence de Spotify et
# de l'AirPlay realtime : AUCUN reechantillonnage, contrairement au "default"
# generique qui aurait converti en 48000 Hz.
#
# 32 bits et non 16 : un flux AirPlay 2 lossless 24 bits garde toute sa
# resolution, et la marge fixe de go-librespot (pcm.golibrespot_gain) est
# appliquee sans perdre de bits. Les sources 16 bits sont simplement elargies
# par "plug", sans perte.

# Les sources n'ecrivent PLUS sur le DAC : elles ecrivent dans la boucle ALSA,
# ou CamillaDSP les lit, applique l'egaliseur, puis alimente le DAC.
# Le DAC n'a donc qu'un seul client : CamillaDSP.
pcm.enceinte {
    type dmix
    ipc_key 1024
    # 0666 est indispensable : les deux services tournent sous des utilisateurs
    # differents (shairport-sync et l'utilisateur du dashboard) et doivent
    # partager le meme segment IPC.
    ipc_perm 0666
    slave {
        # Cote ECRITURE de la boucle. Reference par nom : l'index de la carte
        # peut changer, pas son nom.
        pcm "hw:Loopback,0,0"
        rate 44100
        format S32_LE
        channels 2
        # Meme dimensionnement que celui valide contre les underruns.
        period_size 1024
        buffer_size 16384
    }
    bindings {
        0 0
        1 1
    }
}

# "plug" absorbe un eventuel ecart de format d'une source (mono, 48 kHz...)
# sans rien convertir quand le format correspond deja.
pcm.!default {
    type plug
    slave.pcm "enceinte"
}

# go-librespot (EXPERIMENTAL) : marge fixe avant le mixeur.
# librespot attenue lui-meme le son avec le volume Spotify (50 % par defaut =
# -30 dB) AVANT le mixeur du DAC : c'est cette marge qui permet de monter le
# potar presque au maximum sans que l'ampli sature. go-librespot, en
# external_volume, envoie le son a pleine echelle : sans marge, l'ampli
# saturait puis coupait des ~47 % du potar. Ce route applique un gain fixe
# (GO_LIBRESPOT_GAIN_DB dans /etc/default/enceinte), les potars dashboard et
# Spotify gardant toute leur course. Coefficient calcule par install.sh.
pcm.golibrespot {
    type plug
    slave.pcm "golibrespot_gain"
}
pcm.golibrespot_gain {
    type route
    slave {
        pcm "enceinte"
        channels 2
    }
    ttable.0.0 @GO_LIBRESPOT_GAIN@
    ttable.1.1 @GO_LIBRESPOT_GAIN@
}

# Les controles de volume (amixer) visent le DAC, designe par NOM : activer le
# jack integre renumerote les index et ferait pointer un index fige sur la
# mauvaise carte. Le dashboard, lui, cible toujours explicitement une carte.
ctl.!default {
    type hw
    card "@CTL_CARD@"
}
