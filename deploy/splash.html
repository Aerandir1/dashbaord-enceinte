<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enceinte — démarrage…</title>
  <style>
    /* Écran de chargement AUTONOME, servi par nginx quand le dashboard n'est
       pas encore prêt (fenêtre de démarrage). Visuellement identique à l'écran
       inline de l'appli pour une transition invisible. */
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.4rem;
      background: #0d1117; color: #e6edf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .splash-logo { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 76px; }
    .splash-bar {
      width: 10px; border-radius: 6px; transform-origin: bottom;
      background: linear-gradient(180deg, #4f8cff, #7c5cff);
      animation: splashBars 1s ease-in-out infinite;
    }
    .splash-bar:nth-child(1) { height: 34px; animation-delay: 0s; }
    .splash-bar:nth-child(2) { height: 60px; animation-delay: .15s; }
    .splash-bar:nth-child(3) { height: 76px; animation-delay: .30s; }
    .splash-bar:nth-child(4) { height: 48px; animation-delay: .45s; }
    .splash-title { font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; }
    .splash-sub { font-size: .85rem; opacity: .6; }
    @keyframes splashBars { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .splash-bar { animation: none; } }
    @media (prefers-color-scheme: light) { body { background: #f6f8fa; color: #1f2328; } }
  </style>
  <script>
    // Le backend démarre encore : on retente tout seul jusqu'à ce qu'il réponde.
    setTimeout(function () { location.reload(); }, 2500);
  </script>
</head>
<body>
  <div class="splash-logo" aria-hidden="true">
    <span class="splash-bar"></span><span class="splash-bar"></span>
    <span class="splash-bar"></span><span class="splash-bar"></span>
  </div>
  <div class="splash-title">Enceinte</div>
  <div class="splash-sub">Démarrage…</div>
</body>
</html>
