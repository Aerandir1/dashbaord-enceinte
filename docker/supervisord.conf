; Supervisord — orchestrateur des services du conteneur enceinte.
; Remplace systemd : le dashboard pilote librespot / shairport-sync via
; supervisorctl (voir SERVICE_MANAGER=supervisor).

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; --- Bus système : requis par avahi ---
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- mDNS / Bonjour : découverte AirPlay (et Spotify Connect) sur le réseau ---
[program:avahi]
command=/usr/sbin/avahi-daemon -f /etc/avahi/avahi-daemon.conf --no-chroot --no-rlimits
autostart=true
autorestart=true
priority=20
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- AirPlay (shairport-sync) ---
[program:shairport-sync]
; chrt force l'ordonnancement temps réel (SCHED_FIFO) : sans ça le thread audio
; reste en SCHED_OTHER et le moindre pic CPU provoque des craquements.
; Priorité modérée (45) pour ne pas concurrencer les threads noyau critiques.
command=/usr/local/bin/rt-exec.sh /usr/bin/shairport-sync --use-stderr -c /etc/shairport-sync.conf
autostart=%(ENV_AIRPLAY_AUTOSTART)s
autorestart=true
priority=30
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Spotify Connect (librespot) ---
[program:librespot]
command=/usr/local/bin/rt-exec.sh /usr/local/bin/librespot-run.sh
autostart=%(ENV_SPOTIFY_AUTOSTART)s
autorestart=true
priority=30
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Dashboard web Flask ---
[program:dashboard]
; nice 10 : le dashboard cède le CPU aux services audio en cas de contention.
command=nice -n 10 python3 /app/run.py
directory=/app
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
