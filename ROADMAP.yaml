    phase: phase-3
    section: ui
    category: ui
    goal: Afficher uniquement des données vraies (Wi-Fi dBm, carte son, format joué, température CPU) à la place de valeurs inventées (batterie, firmware).
    description: "Commits 92cfcfd et b1d6f10 (retrait du panneau de spectre FFT)."
    done_when:
