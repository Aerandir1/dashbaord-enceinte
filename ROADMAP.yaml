    description: "Commits 84678f0 (« Charment bien » : deploy/nginx-enceinte.conf, deploy/splash.html, static/js/sw.js, ENABLE_NGINX) et 1c1a82a (versionnage des fichiers statiques pour invalider le cache après une mise à jour)."
    done_when:
