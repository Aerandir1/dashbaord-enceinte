version: 1
project: projet-enceinte
description: Tableau de bord Flask et chaîne audio d'une enceinte connectée maison sur Raspberry Pi (Spotify, AirPlay, égaliseur CamillaDSP), pilotable par Domus via le protocole Onde.
phases:
  - id: phase-1
    title: Socle audio et déploiement sur le Pi
  - id: phase-2
    title: Sources, métadonnées et égaliseur
  - id: phase-3
    title: Réglages de l'enceinte et interface
  - id: phase-4
    title: Intégration Domus et nouvelles sources
  - id: phase-5
    title: Fiabilité et documentation
sections:
  - id: socle
    title: Socle Flask et déploiement
  - id: audio
    title: Chaîne audio et volume
  - id: sources
    title: Sources (Spotify, AirPlay, Music Assistant)
  - id: dsp-eq
    title: DSP et égaliseur
  - id: ui
    title: Interface (dashboard Pip-Boy)
  - id: reseau
    title: Réglages et réseau
  - id: onde
    title: Protocole Onde et Domus
  - id: qualite
    title: Fiabilité, tests et documentation
  - id: materiel
    title: Matériel (PCB, DAC, ampli)
nodes:
  # ───────────── Socle Flask et déploiement ─────────────
  - id: dashboard-flask
    title: Tableau de bord Flask (lecture, volume, sourdine)
    status: done
    depends_on: []
    phase: phase-1
    section: socle
    category: backend
    goal: Piloter l'enceinte depuis un navigateur du réseau local.
    description: "Historique : commit initial 08bd00a (15/03/2026), contrôle AirPlay via shairport-sync (bf62e92), Spotify via un service utilisateur librespot sans sudo (65907b5), métadonnées AirPlay améliorées (f4255fb)."
    implementation:
      - "Application Flask (app/__init__.py, app/views.py, app/config.py) lancée par run.py"
      - "Routes /api/state, lecture/pause/suivant/précédent, volume et mute, flux SSE pour l'état"
      - "Services Spotify et AirPlay pilotés par l'utilisateur du dashboard, sans sudo"
    done_when:
      - Le dashboard pilote lecture, volume et sourdine depuis un navigateur du réseau local

  - id: integration-docker
    title: Intégration Docker (conteneur et supervisord)
    status: done
    depends_on: [dashboard-flask]
    phase: phase-1
    section: socle
    category: infra
    goal: "Premier mode de déploiement : tout dans un conteneur, avec les services audio supervisés."
    description: "Commits 6905610 et 0816b7f (27/08) « meilleure intégration docker », puis abandon au profit de l'installation native (a680967). Dockerfile, docker-compose.yml, docker/entrypoint.sh et README_DOCKER.md restent dans le dépôt, désormais secondaires."
    implementation:
      - Dockerfile, docker-compose.yml et docker/entrypoint.sh
      - supervisord pour lancer le dashboard, shairport-sync et librespot
    done_when:
      - Le conteneur démarre le dashboard et les services audio

  - id: deploiement-natif-systemd
    title: Installation native systemd et serveur waitress
    status: done
    depends_on: [dashboard-flask]
    phase: phase-1
    section: socle
    category: infra
    goal: Faire tourner le dashboard et les services audio sur le Pi sans Docker, de façon stable et sans craquements.
    description: "Commits a680967 (installation native sans Docker), 11e16c8 (serveur WSGI waitress + correctif SSE), 1b1a4b8 (ne plus sourcer /etc/default/enceinte dans le shell)."
    implementation:
      - deploy/install.sh: paquets, utilisateur dédié, unités systemd, sudoers restreint
      - Serveur de production waitress à la place du serveur de développement Flask, avec correctif du flux SSE
      - Configuration par /etc/default/enceinte (deploy/enceinte.env), lue par systemd et non sourcée dans le shell
    done_when:
      - sudo ./deploy/install.sh installe tout sur un Raspberry Pi vierge
      - Le dashboard démarre au boot et survit à un redémarrage

  - id: fix-craquements-audio
    title: Fin des craquements audio (contention CPU, tampon ALSA)
    status: done
    depends_on: [deploiement-natif-systemd]
    phase: phase-1
    section: socle
    category: infra
    goal: Supprimer les craquements AirPlay et Spotify observés sur le Raspberry Pi 3.
    description: "Commits c705bfb (perf), 6506e63, 4fec59c. Diagnostic mesuré : /api/state prenait 2,6 s à cause de supervisorctl relancé à chaque requête, et le thread audio de shairport-sync était préempté."
    implementation:
      - Un seul « supervisorctl status » groupé au lieu d'un appel par service
      - Cache TTL de 3 s sur l'état système, forcé après chaque action utilisateur
      - nice -n 10 sur le dashboard pour qu'il cède le CPU à l'audio
      - Tampon ALSA explicite pour shairport-sync
      - Retrait de l'ordonnancement temps réel de librespot (SCHED_FIFO écarté)
    done_when:
      - Plus de craquements en lecture AirPlay et Spotify simultanément au dashboard ouvert

  # ───────────── Chaîne audio et volume ─────────────
  - id: carte-partagee-dmix
    title: Carte son partagée (dmix) et sortie HiFiBerry ou jack
    status: done
    depends_on: [deploiement-natif-systemd]
    phase: phase-1
    section: audio
    category: infra
    goal: Permettre à plusieurs services audio de coexister et choisir la sortie physique.
    description: "Commit 04e346d (27/08) : carte partageable via dmix, AirPlay et Spotify coexistent."
    implementation:
      - deploy/asound.conf avec dmix sur la carte physique
    done_when:
      - AirPlay et Spotify peuvent ouvrir la carte sans conflit « device busy »

  - id: choix-sortie-audio
    title: Choix de la sortie physique (HiFiBerry ou jack)
    status: done
    depends_on: [carte-partagee-dmix]
    phase: phase-1
    section: audio
    category: backend
    goal: Basculer la sortie audio entre le DAC HiFiBerry et la prise jack depuis le dashboard.
    description: "Commits 5478891 (module app/outputs.py) et 3f21ad8 (dtparam=audio=on doit précéder les overlays dans config.txt). Le modèle Onde est déduit de la sortie active (37ada2a)."
    implementation:
      - app/outputs.py: détection des cartes, sortie active, bascule
      - install.sh: écriture de config.txt dans le bon ordre
      - Sélecteur de sortie dans le dashboard
    done_when:
      - Changer de sortie dans l'interface déplace le son sur la nouvelle carte

  - id: potar-de-son-lineaire
    title: Potar de son linéaire
    status: done
    depends_on: [carte-partagee-dmix]
    category: backend
    section: audio
    scope: Potar volume, pas front end
    goal: "Aujourd'hui le volume dans sur la plage 0% : 50% est inaudible, je pense que le potar de volume est exponentiel"
    description: "Commit e2ceffe (08/11) : courbe perceptive via amixer -M."
    implementation:
      - Modifier la fonction, linéariser la fonction, je sais pas trop ce qui est possible de faire mais toute les enceinte actuel on un volume linaire en focntion du potar donc c'est possible
    phase: phase-1

  - id: volume-commun-pcm5102a
    title: Étage de volume commun pour le DAC PCM5102A
    status: todo
    depends_on: [potar-de-son-lineaire]
    phase: phase-4
    section: audio
    category: backend
    goal: "Le PCM5102A n'a aucun contrôle de volume matériel : prévoir un étage logiciel unique (CamillaDSP ou mixeur softvol) pour que dashboard, Spotify, AirPlay et Onde agissent sur le même volume."
    done_when:
      - Le volume fonctionne sur le DAC PCM5102A sans mixeur matériel
      - Une seule courbe perceptive s'applique, sans double atténuation
      - Le volume est identique pour toutes les sources

  # ───────────── Sources ─────────────
  - id: source-spotify
    title: Spotify Connect avec métadonnées réelles (librespot --onevent)
    status: done
    depends_on: [carte-partagee-dmix]
    phase: phase-2
    section: sources
    category: integration
    goal: Diffuser Spotify et afficher titre, artiste et pochette dans le tableau de bord.
    description: "Commit e913a38 (27/08) : métadonnées réelles via le hook --onevent de librespot (deploy/librespot-event.sh). Service deploy/librespot.service."
    implementation:
      - Hook --onevent de librespot écrivant l'état de lecture lu par le dashboard
      - Nom Spotify issu de SPOTIFY_NAME
    done_when:
      - Titre, artiste et pochette Spotify s'affichent dans le dashboard

  - id: source-airplay
    title: AirPlay avec métadonnées et contrôle via MPRIS
    status: done
    depends_on: [carte-partagee-dmix]
    phase: phase-2
    section: sources
    category: integration
    goal: Diffuser AirPlay et piloter lecture, pause et piste suivante depuis le tableau de bord.
    description: "Commits bf62e92, f4255fb, befe5c4 et 4c132d8 (« MetaData fixed » v1 et v2). Interface MPRIS de shairport-sync interrogée avec busctl --json, sans dépendance D-Bus Python (app/airplay.py)."
    implementation:
      - app/airplay.py: métadonnées titre/artiste/album et pochette (mpris:artUrl)
      - Contrôle Play, Pause, PlayPause, Next, Previous
      - Pochette servie par /api/airplay/cover
    done_when:
      - Métadonnées, pochette et boutons de contrôle AirPlay fonctionnent depuis le dashboard

  - id: selecteur-source-unique
    title: Une seule source active à la fois, avec sélecteur dédié
    status: done
    depends_on: [source-spotify, source-airplay]
    phase: phase-2
    section: sources
    category: backend
    goal: Éviter que les deux services audio se disputent la carte son en boucle.
    description: "Commits 73b6ad7 (sélecteur dédié) et 5bf12ef (stoppe le ping-pong entre les deux services via Conflicts= dans librespot.service et shairport-sync-override.conf)."
    done_when:
      - Choisir une source arrête les autres, sans redémarrage en boucle

  - id: source-music-assistant
    title: Music Assistant / Squeezelite comme vraie source
    status: todo
    depends_on: [selecteur-source-unique]
    phase: phase-4
    section: sources
    category: integration
    goal: Ajouter une quatrième source alimentée par la bibliothèque musicale locale, aujourd'hui seulement annoncée « Bientôt ».
    description: "Annoncée « 4e source, à venir » dans l'interface depuis 613587a."
    done_when:
      - Squeezelite est installé par deploy/install.sh et sort le son par la chaîne CamillaDSP
      - Choisir Music Assistant dans le sélecteur arrête Spotify et AirPlay, et inversement
      - Le tableau de bord et /onde/v1/state affichent titre, artiste et pochette de la piste Music Assistant
      - La mention « Bientôt » a disparu du sélecteur

  - id: go-librespot-volume-jumeau
    title: 'go-librespot expérimental : volume jumeau dashboard ↔ Spotify Connect'
    status: in_progress
    depends_on: [source-spotify, potar-de-son-lineaire]
    phase: phase-4
    section: sources
    category: feature
    goal: Synchroniser dans les deux sens le potar du dashboard et le volume Spotify Connect, en proposant go-librespot comme alternative expérimentale à librespot au moment de l'installation.
    description: "Commit 272197c (16/11). Version figée v0.10.5. Le 17/11 : plafond de volume configurable (51f30ec, laissé à 100 % par défaut), normalisation désactivée pour retrouver le niveau de librespot (496c589), puis atténuation fixe en ALSA avant le dmix (e12d522). En attente du test sur le Pi pour clore i1."
    implementation:
      - 'install.sh : choix librespot / go-librespot (option, variable ou question)'
      - Unité go-librespot installée sous le nom librespot.service (sudoers, Conflicts, netctl inchangés)
      - "external_volume : go-librespot n'applique pas le volume, le dashboard reste le seul étage"
      - 'app/golibrespot.py : websocket /events -> mixeur système + métadonnées ; potar -> POST /player/volume'
      - 'VOLUME_MAX_PERCENT : plafond du mixeur (51f30ec), 100 % par défaut, réglage conservé'
      - 'deploy/go-librespot.yml : normalisation_disabled: true (go-librespot normalisait à −14 LUFS, 5 à 8 dB de moins que librespot)'
      - "deploy/asound.conf : pcm.golibrespot (plug -> route à gain fixe GO_LIBRESPOT_GAIN_DB, −26 dB par défaut -> dmix), marge que librespot obtenait par son volume logiciel"
    done_when:
      - Tourner le potar du dashboard déplace le curseur de l'appli Spotify
      - Changer le volume dans l'appli Spotify déplace le potar du dashboard
      - L'installation par défaut (librespot) est inchangée
      - Le comportement du volume est vérifié quand le dashboard est arrêté
    issues:
      - id: i1
        title: Crackment deconection volume quand le volume est depasse 48- 47 %
        status: open
        created: '2026-11-17'
        description: Quand je veux augmeter le volume, le son coupe crack comme ci ça cliper mais ça cut vriament, arrive a 47 % 48 %, peut importe le potar
        notes: "Correctifs 51f30ec, 496c589 et e12d522 (17/11) : marge fixe −26 dB pour go-librespot. À tester sur le Pi, potars à 100 % ; remonter GO_LIBRESPOT_GAIN_DB par pas de 2 dB si pas de coupure. Si librespot coupe aussi, la limite vient de l'ampli TPA3116 ou de son alimentation."

  - id: go-librespot-commandes-lecture
    title: 'go-librespot : commandes de lecture depuis le dashboard et Onde'
    status: done
    depends_on: [go-librespot-volume-jumeau]
    phase: phase-4
    section: sources
    category: feature
    goal: Piloter la lecture Spotify (lecture, pause, suivant, précédent) depuis l'enceinte quand go-librespot est le backend, ce que librespot ne permet pas.
    description: "Commit 8ce4535 (17/11). Testé contre un go-librespot simulé, pas encore sur le Pi."
    implementation:
      - "app/golibrespot.py : playback_command() -> POST /player/playpause, /resume, /pause, /next, /prev"
      - "app/views.py : /api/playback transmet à go-librespot quand le pont est actif (librespot : erreur explicite inchangée)"
      - "app/onde.py : controls vrais pour Spotify si une piste est chargée et le websocket connecté ; _transport() relaie la commande"
      - ONDE.md mis à jour (champ controls)
    done_when:
      - Les boutons du dashboard pilotent la lecture Spotify avec go-librespot
      - Les commandes Onde play / pause / toggle / next / previous marchent pour Spotify avec go-librespot
      - Sans session Spotify ouverte, une erreur claire est renvoyée
      - Avec librespot, le comportement est inchangé

  # ───────────── DSP et égaliseur ─────────────
  - id: chaine-camilladsp
    title: Chaîne audio CamillaDSP avec garde-fou de validation
    status: done
    depends_on: [carte-partagee-dmix]
    phase: phase-2
    section: dsp-eq
    category: backend
    goal: Faire passer tout le son par un DSP pour y appliquer un traitement.
    description: "Commits 8a9b7de (étape 1 : boucle ALSA aloop + camilladsp.service), 4115ce3 (config valide + garde-fou de validation) et 78383cb (réparation de l'EQ, asound.conf)."
    implementation:
      - deploy/aloop.conf, deploy/camilladsp.yml, deploy/camilladsp.service
      - Les sources jouent dans la boucle ALSA, CamillaDSP lit la boucle et joue sur la carte
      - Validation de la config avant redémarrage du service, pour ne jamais couper le son
    done_when:
      - Tout le son passe par CamillaDSP
      - Une config invalide est refusée sans interrompre la lecture

  - id: eq-parametrique
    title: Égaliseur paramétrique avec éditeur de courbe et potards
    status: done
    depends_on: [chaine-camilladsp]
    phase: phase-2
    section: dsp-eq
    category: ui
    goal: Régler finement le rendu sonore de l'enceinte depuis l'interface.
    description: "Commits e4a699f (étape 2 : égaliseur réellement actif, app/eq.py), c416ff3 (étape 3 : éditeur de courbe static/js/eq-editor.js), 1ef03d0 (potards rotatifs façon plugin), ac88ba5 (panneau de bande flottant au-dessus du point sélectionné)."
    implementation:
      - app/eq.py génère la config CamillaDSP à partir des bandes
      - Éditeur de courbe interactif (glisser les points)
      - Potards rotatifs fréquence/gain/Q et panneau flottant par bande
    done_when:
      - Modifier une bande change le son en direct

  # ───────────── Interface ─────────────
  - id: ui-pipboy
    title: Interface façon Pip-Boy, plein écran et pictogrammes SVG
    status: done
    depends_on: [dashboard-flask]
    phase: phase-3
    section: ui
    category: ui
    goal: Donner au tableau de bord une identité visuelle soignée, sur mobile comme sur ordinateur.
    description: "Commits 6a61f3b (refonte Fallout, polices VT323 et Share Tech Mono auto-hébergées), 8ed4e8e (plein écran ordinateur + page /reglages, thèmes vert/ambre/auto), d7964cb (pictogrammes SVG à la place des emoji). Précédé par « New Dashboard » (fb19721) et la jauge de loudness (5007d2b)."
    implementation:
      - Phosphore vert/ambre, rivets, lignes de balayage
      - Page Réglages séparée, mise en page 3 colonnes sur ordinateur
      - Polices auto-hébergées pour fonctionner hors ligne sur le point d'accès
